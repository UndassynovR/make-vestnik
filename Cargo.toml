[package]
name = "make-vestnik"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
colored = "3.0.0"
notify = "8.0.0"
pandoc = "0.8.11"
regex = "1.11.1"
zip = { version = "4.0.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
panic = "abort"
strip = true

